version: '3.8'

services:
  java-app:
    build: .
    container_name: java_http_app
    environment:
      - PORT=${APP_PORT:-8080}
    ports:
      # Maps external port (APP_PORT) to internal port (APP_PORT)
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s